<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Site Simples</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
    }

    header {
      background: #333;
      color: white;
      text-align: center;
      padding: 10px;
    }

    nav {
      background: #555;
      text-align: center;
      padding: 10px;
    }

    nav a {
      color: white;
      margin: 10px;
      text-decoration: none;
    }

    .card {
      background: #eee;
      margin: 10px;
      padding: 10px;
      text-align: center;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Meu Site</h1>
  </header>

  <nav>
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
  </nav>

  <div class="card">
    <h3>Card 1</h3>
    <p>Texto simples</p>
  </div>

  <div class="card">
    <h3>Card 2</h3>
    <p>Texto simples</p>
  </div>

  <footer>
    <p>Rodapé</p>
  </footer>

</body>
</html>
